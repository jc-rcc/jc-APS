name: JC-APS CI and Verified Vercel Deployment

on:
  push:
    branches: [main]
    paths:
      - 'rcc-aps/**'
      - '.github/workflows/deploy.yml'
      - '.vercelignore'
  pull_request:
    branches: [main]
    paths:
      - 'rcc-aps/**'
      - '.github/workflows/deploy.yml'
      - '.vercelignore'

permissions:
  contents: read
  statuses: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: rcc-aps
    env:
      DATABASE_TEST_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      JWT_SECRET: ci-only-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rcc-aps/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run smoke and serverless HTTP tests
        run: npm test
      - name: Test PostgreSQL setup, data persistence and concurrent saves
        run: node test/database-upgrade.integration.js
      - name: Test Google authentication against isolated PostgreSQL
        run: node test/google-sso.integration.js

  deploy:
    name: Verify automatic Vercel production deployment
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jc-rcc/jc-APS'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://jc-aps.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify matching Vercel Git deployment and live application
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node rcc-aps/scripts/verify-vercel-git-deployment.js
